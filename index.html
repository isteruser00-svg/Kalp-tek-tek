<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tek Dokunuş Tek Kalp</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: manipulation;
        }

        #hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
            letter-spacing: 2px;
            pointer-events: none;
            transition: opacity 0.8s ease;
            text-align: center;
        }

        .heart {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            will-change: transform, opacity;
            animation: fallAndFade 2s ease-out forwards;
        }

        @keyframes fallAndFade {
            0% {
                transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            20% {
                transform: translate(-50%, -50%) scale(1.3) rotate(var(--rotation));
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--drift)), calc(-50% + 180px)) scale(0.8) rotate(var(--rotation));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div id="hint">Ekrana Dokun ❤️🤍</div>

    <script>
        const hint = document.getElementById('hint');
        let initialTouch = true;
        
        // Kırmızı ve beyaz kalp emoji listesi
        const heartTypes = ['❤️', '🤍'];
        let heartIndex = 0;

        // Dokunulan tam noktada tek bir kalp oluşturur
        function spawnSingleHeart(x, y) {
            if (initialTouch) {
                hint.style.opacity = '0';
                initialTouch = false;
            }

            const heart = document.createElement('div');
            heart.className = 'heart';

            // Sırayla bir kırmızı bir beyaz kalp çıkar
            heart.innerText = heartTypes[heartIndex];
            heartIndex = (heartIndex + 1) % heartTypes.length;

            // Düşerken sağa veya sola hafif süzülme miktarı
            const drift = (Math.random() - 0.5) * 60;
            // Hafif dönme açısı
            const rotation = (Math.random() - 0.5) * 40;
            // Kalp boyutu (28px - 36px arası)
            const fontSize = 28 + Math.random() * 8;

            heart.style.left = x + 'px';
            heart.style.top = y + 'px';
            heart.style.fontSize = fontSize + 'px';
            heart.style.setProperty('--drift', drift + 'px');
            heart.style.setProperty('--rotation', rotation + 'deg');

            document.body.appendChild(heart);

            // Kalp süzülüp kaybolduktan sonra (2 saniye) ekrandan ve hafızadan silinir
            setTimeout(() => {
                heart.remove();
            }, 2000);
        }

        // Fare ile tıklama (Masaüstü)
        window.addEventListener('click', (e) => {
            spawnSingleHeart(e.clientX, e.clientY);
        });

        // Parmağınızla dokunma (Mobil telefonlar)
        window.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                spawnSingleHeart(touch.clientX, touch.clientY);
            }
        }, { passive: true });
    </script>
</body>
</html>
